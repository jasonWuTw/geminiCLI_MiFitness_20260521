<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人健康運動儀表板 - 靜息心率分析</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Flatpickr -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/zh-tw.js"></script>
</head>

<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">
    <div class="max-w-5xl mx-auto py-10 px-4">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-bold text-blue-700 mb-2">靜息心率 (RHR) 趨勢儀表板</h1>
            <p class="text-gray-600">健康專家團隊為您提供的個人化心率分析</p>
        </header>

        <!-- 警語 -->
        <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-8 rounded shadow-sm">
            <div class="flex">
                <div class="flex-shrink-0">
                    <svg class="h-5 w-5 text-yellow-400" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z"
                            clip-rule="evenodd" />
                    </svg>
                </div>
                <div class="ml-3">
                    <h3 class="text-sm font-medium text-yellow-800">重要警語</h3>
                    <p class="text-sm text-yellow-700 mt-1">
                        本儀表板與 AI 生成之分析僅供健康管理與趨勢參考，並非醫療診斷。數據與分析可能存在誤差，如有任何身體不適或醫療需求，請務必尋求專業醫師之評估與建議。
                    </p>
                </div>
            </div>
        </div>

        <!-- 控制區 -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-4">篩選條件</h2>
            <div class="flex flex-col md:flex-row gap-4 items-center">
                <div class="w-full md:w-1/4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">選擇年份</label>
                    <select id="yearPicker"
                        class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md text-sm shadow-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                        <option value="">選擇年份...</option>
                        <option value="2023">2023</option>
                        <option value="2024">2024</option>
                        <option value="2025">2025</option>
                        <option value="2026">2026</option>
                    </select>
                </div>
                <div class="w-full md:w-1/3">
                    <label class="block text-sm font-medium text-gray-700 mb-1">選擇日期範圍</label>
                    <input type="text" id="datePicker" placeholder="預設顯示最近30筆"
                        class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md text-sm shadow-sm placeholder-gray-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                </div>
                <div class="w-full md:w-auto mt-auto">
                    <button id="resetBtn"
                        class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded shadow">
                        重置 (顯示最近30筆)
                    </button>
                </div>
            </div>
        </div>

        <!-- 專家建議區 -->
        <div class="bg-blue-50 border border-blue-200 p-6 rounded-lg shadow-md mb-8">
            <div class="flex items-center mb-4">
                <div class="bg-blue-600 text-white p-2 rounded-full mr-3">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
                <h2 class="text-2xl font-bold text-blue-800">專家團隊分析</h2>
            </div>
            <div id="expertAdvice" class="text-lg text-gray-700 leading-relaxed">
                正在分析您的心率數據...
            </div>
        </div>

        <!-- 圖表區 -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4 text-gray-800">靜息心率趨勢</h2>
            <div id="noDataMsg" class="hidden text-center text-gray-500 py-20 text-xl font-bold">
                沒有靜息心率
            </div>
            <div id="chartContainer" class="relative h-96 w-full">
                <canvas id="rhrChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        let availableDates = [];
        let fpInstance = null;
        let chartInstance = null;

        // 初始化
        async function init() {
            try {
                // 1. 獲取有資料的日期列表
                const res = await fetch('/api/available_dates');
                availableDates = await res.json();

                // 2. 初始化日期選擇器
                initDatePicker();

                // 3. 載入預設資料 (最近30筆)
                loadData();
            } catch (error) {
                console.error("Initialization failed:", error);
            }
        }

        function initDatePicker() {
            fpInstance = flatpickr("#datePicker", {
                mode: "range",
                locale: "zh_tw",
                dateFormat: "Y-m-d",
                enable: availableDates, // 只有在 availableDates 中的日期才可選，其他會呈現灰色且無法點擊
                onChange: function (selectedDates, dateStr, instance) {
                    // 當選擇了完整的範圍時更新資料
                    if (selectedDates.length === 2) {
                        const start = instance.formatDate(selectedDates[0], "Y-m-d");
                        const end = instance.formatDate(selectedDates[1], "Y-m-d");
                        loadData(start, end);
                    }
                }
            });

            document.getElementById('yearPicker').addEventListener('change', (e) => {
                const year = e.target.value;
                if (year) {
                    fpInstance.clear();
                    const start = `${year}-01-01`;
                    const end = `${year}-12-31`;
                    loadData(start, end);
                }
            });

            document.getElementById('resetBtn').addEventListener('click', () => {
                fpInstance.clear();
                document.getElementById('yearPicker').value = "";
                loadData(); // 不帶參數則預設抓取最近 30 筆
            });
        }

        async function loadData(start = null, end = null) {
            let url = '/api/rhr';
            if (start && end) {
                url += `?start=${start}&end=${end}`;
            } else {
                url += `?limit=30`; // 預設 30 筆
            }

            try {
                const res = await fetch(url);
                const data = await res.json();

                updateUI(data);
            } catch (error) {
                console.error("Failed to load data:", error);
            }
        }

        async function updateUI(data) {
            const chartContainer = document.getElementById('chartContainer');
            const noDataMsg = document.getElementById('noDataMsg');
            const expertAdvice = document.getElementById('expertAdvice');

            if (!data || data.length === 0) {
                chartContainer.style.display = 'none';
                noDataMsg.classList.remove('hidden');
                expertAdvice.innerHTML = '<span class="text-red-500 font-bold">沒有靜息心率</span>，無法進行分析。請選擇其他日期範圍。';
                return;
            }

            // 有資料
            chartContainer.style.display = 'block';
            noDataMsg.classList.add('hidden');

            // 繪製圖表
            drawChart(data);

            // 取得分析建議
            try {
                const res = await fetch('/api/analysis', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data: data })
                });
                const analysisResult = await res.json();

                // 支援 markdown bold (簡易替換)
                let htmlAdvice = analysisResult.advice.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                expertAdvice.innerHTML = htmlAdvice;
            } catch (error) {
                expertAdvice.innerHTML = '分析服務暫時無法使用。';
            }
        }

        function drawChart(data) {
            const ctx = document.getElementById('rhrChart').getContext('2d');

            const labels = data.map(d => d.date);
            const values = data.map(d => d.bpm);

            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '靜息心率 (bpm)',
                        data: values,
                        borderColor: 'rgb(59, 130, 246)', // Tailwind blue-500
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        borderWidth: 2,
                        pointBackgroundColor: 'rgb(37, 99, 235)', // Tailwind blue-600
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        },
                        tooltip: {
                            callbacks: {
                                label: function (context) {
                                    return `心率: ${context.parsed.y} bpm`;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            title: {
                                display: true,
                                text: 'BPM (次/分鐘)'
                            },
                            suggestedMin: 40,
                            suggestedMax: 100
                        },
                        x: {
                            title: {
                                display: true,
                                text: '日期'
                            }
                        }
                    }
                }
            });
        }

        // 啟動
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
